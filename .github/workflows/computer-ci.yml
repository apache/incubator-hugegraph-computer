name: "Computer CI"

on:
  push:
    branches:
      - master
      - release-*
    paths:
      - computer/**
      - .github/workflows/computer-ci.yml
      - .github/configs/settings.xml
  pull_request:
    paths:
      - computer/**
      - .github/workflows/computer-ci.yml
      - .github/configs/settings.xml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: computer

jobs:
  computer-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: computer-dist/src/assembly/travis
      BSP_ETCD_URL: http://localhost:2579
      KUBERNETES_VERSION: 1.20.1
      GRAPH_ENV_VERSION: 1.7.0 # Published Server/Loader baseline until 1.8.0 images are available.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk17-m2-${{ hashFiles('computer/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk17-m2-

      - name: License check(RAT)
        run: |
          pwd
          mvn apache-rat:check -ntp
          find ./ -name rat.txt -print0 | xargs -0 -I file cat file > merged-rat.txt
          grep "Binaries" merged-rat.txt -C 3 && cat merged-rat.txt

      - name: Setup Python3
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Setup HDFS
        run: '"$TRAVIS_DIR/install-hdfs.sh"'

      - name: Setup Minikube-Kubernetes
        run: '"$TRAVIS_DIR/install-k8s.sh"'

      - name: Check Component
        run: |
          docker exec hugegraph-ci-hdfs-namenode hdfs dfs -ls /dataset
          kubectl get nodes

      - name: Prepare env and service
        run: |
          "$TRAVIS_DIR/install-env.sh"
          "$TRAVIS_DIR/load-data-into-hugegraph.sh" "$GRAPH_ENV_VERSION"

      - name: Use staged maven repo
        if: ${{ env.USE_STAGE == 'true' }}
        run: |
          cp "$HOME/.m2/settings.xml" /tmp/settings.xml
          cp ../.github/configs/settings.xml "$HOME/.m2/settings.xml"

      - name: Compile
        run: mvn clean compile -e -Dmaven.javadoc.skip=true -ntp

      - name: Integrate test
        run: mvn test -P integrate-test -ntp

      - name: Unit test
        run: mvn test -P unit-test -ntp

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: computer/target/site/jacoco/jacoco.xml
